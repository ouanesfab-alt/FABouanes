<div class="search-overlay" id="searchOverlay" role="dialog" aria-modal="true"
     aria-label="Recherche rapide" hidden>
  <div class="search-modal">
    <div class="search-input-row">
      <i class="bi bi-search search-icon"></i>
      <input type="search" id="globalSearchInput" class="search-input"
             placeholder="Rechercher un client, produit, opération…"
             autocomplete="off" spellcheck="false">
      <kbd class="search-kbd">Esc</kbd>
    </div>
    <div class="search-tabs">
      <button class="search-tab active" data-type="all"><i class="bi bi-grid-fill me-1"></i>Tout</button>
      <button class="search-tab" data-type="contacts"><i class="bi bi-people-fill me-1"></i>Contacts</button>
      <button class="search-tab" data-type="products"><i class="bi bi-box-seam-fill me-1"></i>Produits &amp; Stocks</button>
      <button class="search-tab" data-type="operations"><i class="bi bi-receipt-cutoff me-1"></i>Opérations</button>
    </div>
    <div class="search-results" id="searchResults">
      <div class="search-hint">
        <i class="bi bi-search fs-3 d-block mb-2 text-muted opacity-50"></i>
        <span>Tapez au moins 2 caractères pour rechercher…</span>
      </div>
    </div>
    <div class="search-footer">
      <div class="search-footer-hint">
        <span><kbd>↑</kbd><kbd>↓</kbd> Naviguer</span>
        <span><kbd>↵</kbd> Ouvrir</span>
        <span><kbd>Alt</kbd>+<kbd>→</kbd> Onglets</span>
        <span><kbd>Esc</kbd> Quitter</span>
      </div>
    </div>
  </div>
</div>
