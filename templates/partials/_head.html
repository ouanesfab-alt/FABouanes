<script nonce="{{ csp_nonce }}">
  (function() {
    try {
      var t = localStorage.getItem('fab_theme') || 'light';
      if (t === 'auto') t = 'light';
      document.documentElement.setAttribute('data-theme', t);
      var f = localStorage.getItem('fab_font') || 'system';
      document.documentElement.setAttribute('data-font', f);
      var n = localStorage.getItem('fab_nav_layout') || 'horizontal';
      document.documentElement.setAttribute('data-nav', n);
      var h = localStorage.getItem('fab_nav_hidden') || '0';
      document.documentElement.setAttribute('data-nav-hidden', h);
    } catch(e) {}
  })();
</script>
