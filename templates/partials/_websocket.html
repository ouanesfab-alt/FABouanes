{% if g.user %}
<script nonce="{{ csp_nonce }}">
  // Configuration WebSocket globale
  (function initWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = protocol + '//' + window.location.host + '/api/v1/ws';
      let ws;
      let reconnectTimer;

      function connect() {
          ws = new WebSocket(wsUrl);
          ws.onmessage = function(event) {
              let data;
              try {
                  data = JSON.parse(event.data);
              } catch (e) {
                  data = event.data;
              }

              if (typeof data === 'object' && data !== null) {
                  if (data.type === 'overdue_alert') {
                      const label = data.count === 1 ? 'client' : 'clients';
                      showToast(`⚠️ Alerte : ${data.count} ${label} en retard de paiement.`, "warning", false);
                  }
              } else {
                  if (data === 'refresh_operations') {
                      showToast("Nouvelle opération enregistrée à distance.", "info", true);
                      if (window.location.pathname.startsWith('/operations') && typeof window.onOperationsRefresh === 'function') {
                          window.onOperationsRefresh();
                      }
                  } else if (data === 'backup_completed') {
                      showToast("✅ Sauvegarde réseau terminée avec succès.", "success", false);
                  } else if (data === 'low_stock_alert') {
                      showToast("⚠️ Alerte Stock : Un article vient de passer sous le seuil critique !", "warning", false);
                  }
              }
          };
          ws.onclose = function() {
              clearTimeout(reconnectTimer);
              reconnectTimer = setTimeout(connect, 5000);
          };
          ws.onerror = function(err) {
              ws.close();
          };
      }
      
      function showToast(message, category = "info", autoRefresh = false) {
          if (typeof window.showToast === 'function') {
              window.showToast(message, category, { autoHide: !autoRefresh, duration: 5000 });
              return;
          }
          const container = document.getElementById('toastContainer');
          if(!container) return;

          const toastEl = document.createElement('div');
          const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
          const accent = category === 'success' ? '#25D366' : category === 'warning' ? '#f59e0b' : category === 'danger' ? '#ef4444' : '#007AFF';
          const icon = category === 'success' ? 'check-circle-fill' : category === 'warning' ? 'exclamation-triangle-fill' : category === 'danger' ? 'x-circle-fill' : 'bell-fill';

          toastEl.className = 'toast border-0 mb-2 shadow-lg flash-toast';
          toastEl.style.borderRadius = '10px';
          toastEl.style.backgroundColor = isDark ? '#1e2a30' : '#f0f2f5';
          toastEl.style.color = isDark ? '#e9edef' : '#111b21';
          toastEl.style.borderLeft = `4px solid ${accent}`;
          toastEl.style.minWidth = '280px';
          toastEl.style.maxWidth = '360px';
          if (!isDark) toastEl.style.boxShadow = '0 4px 20px rgba(0,0,0,0.15)';

          toastEl.setAttribute('role', 'alert');
          toastEl.setAttribute('aria-live', 'assertive');
          toastEl.setAttribute('aria-atomic', 'true');
          if (autoRefresh) toastEl.setAttribute('data-bs-autohide', 'false');

          toastEl.innerHTML = `
            <div class="toast-body p-3">
              <div class="d-flex align-items-start gap-2">
                <i class="bi bi-${icon} mt-1 flex-shrink-0" style="color:${accent};font-size:0.95rem;"></i>
                <div class="flex-grow-1" style="min-width:0;">
                  <div class="fw-semibold mb-1" style="color:${accent};font-size:0.85rem;">Activité réseau</div>
                  <div style="font-size:0.9rem;line-height:1.4;">${message}</div>
                  ${autoRefresh ? '<button class="btn btn-sm btn-primary mt-2" onclick="location.reload()" style="border-radius:20px;font-weight:600;font-size:0.82rem;padding:4px 14px;border:none;">Rafraîchir</button>' : ''}
                </div>
                <button type="button" class="btn-close ${isDark ? 'btn-close-white' : ''} flex-shrink-0" data-bs-dismiss="toast" aria-label="Fermer" style="font-size:0.7em;opacity:0.75;margin-top:2px;"></button>
              </div>
            </div>
          `;

          container.appendChild(toastEl);
          if (window.bootstrap && window.bootstrap.Toast) {
              const t = new window.bootstrap.Toast(toastEl);
              toastEl.addEventListener('hidden.bs.toast', function() { toastEl.remove(); });
              t.show();
              if(!autoRefresh) { setTimeout(() => { t.hide(); }, 5000); }
          }
      }
      
      connect();
  })();
</script>
{% endif %}
