<script type="module" src="{{ url_for('static', filename='js/main.js', v='20260710-ripple-v12') }}" nonce="{{ csp_nonce }}"></script>
<script src="{{ url_for('static', filename='js/modules/dashboard-fonts.js', v='20260801-v1') }}" nonce="{{ csp_nonce }}"></script>

<script nonce="{{ csp_nonce }}">
  document.addEventListener('DOMContentLoaded', () => {
    const toasts = document.querySelectorAll('.toast');
    toasts.forEach(t => new bootstrap.Toast(t).show());

    // Apply theme-adaptive styling to flash toasts
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.querySelectorAll('.flash-toast').forEach(t => {
      t.style.borderRadius = '10px';
      t.style.backgroundColor = isDark ? '#1e2a30' : '#f0f2f5';
      t.style.color = isDark ? '#e9edef' : '#111b21';
      t.style.borderLeft = '4px solid ' + (t.dataset.accent || '#25D366');
      if (!isDark) t.style.boxShadow = '0 4px 20px rgba(0,0,0,0.15)';
      const closeBtn = t.querySelector('.flash-toast-close');
      if (closeBtn && isDark) closeBtn.classList.add('btn-close-white');
    });

    // Focus explicit autofocus inputs only on desktop, never force virtual keyboard on mobile
    const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    if (!isTouchDevice) {
      const explicitAutofocus = document.querySelector('form input[autofocus]:not([type=hidden]):not([readonly])');
      if (explicitAutofocus && !explicitAutofocus.closest('.modal')) {
        setTimeout(() => explicitAutofocus.focus(), 100);
      }
    }

    // Auto-resize textareas dynamically to fit content cleanly
    const autoResizeTextarea = (el) => {
      if (!el) return;
      el.style.overflowY = 'hidden';
      el.style.height = 'auto';
      if (el.scrollHeight > 0) {
        el.style.height = el.scrollHeight + 'px';
      }
    };
    document.querySelectorAll('textarea').forEach(tx => {
      autoResizeTextarea(tx);
      tx.addEventListener('input', () => autoResizeTextarea(tx));
      tx.addEventListener('focus', () => autoResizeTextarea(tx));
    });
    // Dynamically resize textareas when Bootstrap modals or tabs become visible
    document.addEventListener('shown.bs.modal', (e) => {
      e.target?.querySelectorAll?.('textarea')?.forEach(autoResizeTextarea);
    });
    document.addEventListener('shown.bs.tab', () => {
      document.querySelectorAll('textarea').forEach(autoResizeTextarea);
    });

    // Floating labels select fix
    document.querySelectorAll('.form-float select').forEach(sel => {
      const checkVal = () => { if(sel.value) sel.classList.add('has-value'); else sel.classList.remove('has-value'); };
      sel.addEventListener('change', checkVal);
      checkVal();
    });

    document.addEventListener('keydown', function (e) {
      if (e.ctrlKey && e.key.toLowerCase() === 's') {
        e.preventDefault();
        const submitBtn = document.querySelector('form button[type="submit"]:not(.is-loading)');
        if (submitBtn) submitBtn.click();
      }
      if (e.ctrlKey && e.key.toLowerCase() === 'f') {
        const searchInput = document.querySelector('input[type="search"], input[name="q"]');
        if (searchInput) {
          e.preventDefault();
          searchInput.focus();
          searchInput.select();
        }
      }

      // Raccourcis clavier d'opérations (Alt + Touche) - Ignorés si l'utilisateur saisit du texte
      if (e.altKey && !e.ctrlKey && !e.metaKey) {
        const active = document.activeElement;
        if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) {
          return;
        }
        const key = e.key;
        const keyLower = key.toLowerCase();
        // Alt + ? ou Alt + / => Ouvrir la boîte d'aide raccourcis sans quitter la page
        if (key === '?' || key === '/') {
          e.preventDefault();
          const modalEl = document.getElementById('shortcutsModal');
          if (modalEl && window.bootstrap) {
            window.bootstrap.Modal.getOrCreateInstance(modalEl).show();
          } else {
            window.location.href = '/admin?focus=manual';
          }
          return;
        }
        let targetUrl = "";
        switch (keyLower) {
          // ---- CRÉATION RAPIDE ----
          case 'a': targetUrl = '/quick-add'; break;           // Alt+A → Ajout rapide
          case 's': targetUrl = '/operations/sales/new'; break; // Alt+S → nouvelle Vente (Sale)
          case 'b': targetUrl = '/operations/purchases/new'; break; // Alt+B → nouvel Achat (Buy)
          case 'p': targetUrl = '/operations/payments/new'; break; // Alt+P → nouveau Paiement
          case 'r': targetUrl = '/production/new'; break;      // Alt+R → nouvelle pRoduction
          case 'd': targetUrl = '/expenses/new'; break;        // Alt+D → nouvelle Dépense
          case 'n': targetUrl = '/notes'; break;               // Alt+N → bloc-Note

          // ---- CONTACTS ----
          case 'm': targetUrl = '/contacts/clients/new'; break;  // Alt+M → nouveau client (Membre)
          case 'f': targetUrl = '/contacts/suppliers/new'; break; // Alt+F → nouveau Fournisseur

          // ---- CATALOGUE ----
          case 'k': targetUrl = '/catalog/new'; break;         // Alt+K → nouveau produit catalogue

          // ---- NAVIGATION DIRECTE ----
          case 'o': targetUrl = '/operations'; break;          // Alt+O → Opérations (vue globale)
          case 'c': targetUrl = '/contacts'; break;            // Alt+C → Contacts (vue globale)
          case 'x': targetUrl = '/reports'; break;             // Alt+X → Rapports (eXport)
          case 'h': targetUrl = '/bons'; break;                // Alt+H → Historique bons/PDF
          case 'u': targetUrl = '/contacts?type=supplier'; break; // Alt+U → foUrnissteurs (Upstream)
          case 'g': targetUrl = '/admin'; break;               // Alt+G → Gestion/admin
        }
        if (targetUrl) {
          e.preventDefault();
          window.location.href = targetUrl;
        }
      }
      // Escape => fermer modal raccourcis si ouverte
      if (e.key === 'Escape') {
        const m = document.getElementById('shortcutsModal');
        if (m && window.bootstrap && m.classList.contains('show')) {
          const inst = window.bootstrap.Modal.getInstance(m);
          if (inst) inst.hide();
        }
      }
    });

    // Validation live des champs obligatoires et montants
    document.querySelectorAll('input[required], select[required]').forEach(field => {
      field.addEventListener('blur', function () {
        if (!this.value.trim()) {
          this.classList.add('is-invalid');
          this.classList.remove('is-valid');
        } else {
          this.classList.remove('is-invalid');
          this.classList.add('is-valid');
        }
      });
      field.addEventListener('input', function () {
        if (this.value.trim()) {
          this.classList.remove('is-invalid');
        }
      });
    });

    // Validation montants positifs
    document.querySelectorAll('input[type="number"]').forEach(field => {
      field.addEventListener('blur', function () {
        const val = parseFloat(this.value);
        const min = parseFloat(this.min ?? 0);
        if (this.value !== '' && (isNaN(val) || val < min)) {
          this.classList.add('is-invalid');
          if (!this.nextElementSibling?.classList.contains('invalid-feedback')) {
            const msg = document.createElement('div');
            msg.className = 'invalid-feedback';
            msg.textContent = 'Valeur invalide (doit être ≥ ' + min + ').';
            this.after(msg);
          }
        } else {
          this.classList.remove('is-invalid');
          if (this.value) this.classList.add('is-valid');
        }
      });
    });

    // Enforce Minimaliste Chic (minimalist) active style

    const navLinks = document.querySelector('.nav-links');

    if (navLinks) {

      navLinks.setAttribute('data-active-style', 'minimalist');

      localStorage.setItem('fab_nav_active_style', 'minimalist');

    }

  });

  // Recherche rapide (Spotlight)
  (function () {
    const overlay = document.getElementById('searchOverlay');
    const input   = document.getElementById('globalSearchInput');
    const results = document.getElementById('searchResults');
    if (!overlay) return;

    const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    const isDesktop = !isTouchDevice || window.innerWidth > 1024;

    let selectedIndex = -1;
    const pageLoadTime = Date.now();
    let currentSearchResults = [];
    let selectedCategory = 'all';

    function getItems() {
      return Array.from(results.querySelectorAll('.search-result-item'));
    }

    function updateSelection() {
      const items = getItems();
      items.forEach((item, idx) => {
        if (idx === selectedIndex) {
          item.classList.add('is-selected');
          item.scrollIntoView({ block: 'nearest' });
        } else {
          item.classList.remove('is-selected');
        }
      });
    }

    function openSearch() {
      if (Date.now() - pageLoadTime < 500) return;
      overlay.hidden = false;
      input.value = '';
      selectedIndex = -1;
      currentSearchResults = [];
      selectedCategory = 'all';
      updateTabsUI();
      results.innerHTML = '<div class="search-hint"><i class="bi bi-search fs-3 d-block mb-2 opacity-50"></i>Tapez au moins 2 caractères pour rechercher…</div>';
      setTimeout(() => input.focus(), 50);
    }
    window.openSearch = openSearch;

    function closeSearch() {
      overlay.hidden = true;
    }

    // Ouvrir
    document.getElementById('globalSearchBtn')?.addEventListener('click', openSearch);
    
    // Keyboard listeners
    document.addEventListener('keydown', function (e) {
      const isSearchShortcut = (
        ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') || 
        (e.metaKey && e.code === 'Space')
      );
      
      if (isSearchShortcut) {
        e.preventDefault(); 
        openSearch();
      }
      if (e.key === 'Escape' && !overlay.hidden) {
        closeSearch();
      }
      if (isDesktop && e.key === '/' && overlay.hidden === true
          && document.activeElement.tagName !== 'INPUT'
          && document.activeElement.tagName !== 'TEXTAREA'
          && !document.activeElement.isContentEditable) {
        e.preventDefault(); 
        openSearch();
      }
    });

    overlay.addEventListener('click', function (e) {
      if (!e.target.closest('.search-modal')) {
        closeSearch();
      }
    });

    // Keyboard navigation inside search results
    input.addEventListener('keydown', function (e) {
      const items = getItems();

      // Tab switching with Alt + Left/Right
      if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        e.preventDefault();
        const tabs = Array.from(overlay.querySelectorAll('.search-tab'));
        const activeIdx = tabs.findIndex(t => t.classList.contains('active'));
        let nextIdx = activeIdx + (e.key === 'ArrowLeft' ? -1 : 1);
        if (nextIdx < 0) nextIdx = tabs.length - 1;
        if (nextIdx >= tabs.length) nextIdx = 0;
        tabs[nextIdx].click();
        return;
      }

      if (!items.length) return;

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        selectedIndex = (selectedIndex + 1) % items.length;
        updateSelection();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        selectedIndex = (selectedIndex - 1 + items.length) % items.length;
        updateSelection();
      } else if (e.key === 'Enter') {
        if (selectedIndex >= 0 && selectedIndex < items.length) {
          e.preventDefault();
          items[selectedIndex].click();
        }
      }
    });

    // Handle search input typing
    let timer;
    input.addEventListener('input', function () {
      clearTimeout(timer);
      const q = input.value.trim();
      selectedIndex = -1;
      if (q.length < 2) {
        currentSearchResults = [];
        results.innerHTML = '<div class="search-hint"><i class="bi bi-search fs-3 d-block mb-2 opacity-50"></i>Tapez au moins 2 caractères pour rechercher…</div>';
        return;
      }
      
      // Render beautiful Apple-like Loading Skeletons
      results.innerHTML = Array(3).fill(0).map(() => `
        <div class="search-skeleton-item">
          <div class="skeleton-shimmer" style="width: 44px; height: 44px; border-radius: 10px;"></div>
          <div style="flex: 1; min-width: 0;">
            <div class="skeleton-shimmer" style="width: 50%; height: 16px; margin-bottom: 6px;"></div>
            <div class="skeleton-shimmer" style="width: 30%; height: 12px;"></div>
          </div>
          <div class="skeleton-shimmer" style="width: 60px; height: 18px; border-radius: 6px;"></div>
        </div>
      `).join('');

      timer = setTimeout(() => doSearch(q), 250);
    });

    async function doSearch(q) {
      try {
        const res = await fetch('/api/search?q=' + encodeURIComponent(q));
        if (!res.ok) {
          results.innerHTML = '<div class="search-hint">Erreur lors de la recherche.</div>';
          return;
        }
        const json = await res.json();
        currentSearchResults = json.data || [];
        renderResults(q);
      } catch (e) {
        results.innerHTML = '<div class="search-hint">Erreur lors de la recherche.</div>';
      }
    }

    function renderResults(q = '') {
      if (!currentSearchResults.length) {
        results.innerHTML = '<div class="search-hint">Aucun résultat pour "' +
          (q || input.value).replace(/</g, '&lt;') + '"</div>';
        return;
      }

      // Filter by category selection
      let filtered = currentSearchResults;
      if (selectedCategory === 'contacts') {
        filtered = currentSearchResults.filter(item => ['Client', 'Fournisseur'].includes(item.type));
      } else if (selectedCategory === 'products') {
        filtered = currentSearchResults.filter(item => ['Produit', 'Matière'].includes(item.type));
      } else if (selectedCategory === 'operations') {
        filtered = currentSearchResults.filter(item => ['Vente', 'Achat', 'Paiement'].includes(item.type));
      }

      if (!filtered.length) {
        results.innerHTML = '<div class="search-hint">Aucun résultat dans cette catégorie.</div>';
        return;
      }

      // Group results
      const groups = {};
      filtered.forEach(item => {
        let grpName = 'Autres';
        if (['Client', 'Fournisseur'].includes(item.type)) grpName = 'Contacts';
        else if (['Produit', 'Matière'].includes(item.type)) grpName = 'Catalogue & Stocks';
        else if (['Vente', 'Achat', 'Paiement'].includes(item.type)) grpName = 'Opérations';

        if (!groups[grpName]) groups[grpName] = [];
        groups[grpName].push(item);
      });

      // HTML Render
      let html = '';
      const order = ['Contacts', 'Catalogue & Stocks', 'Opérations', 'Autres'];
      order.forEach(grp => {
        if (groups[grp] && groups[grp].length) {
          html += `<div class="search-group-header">${grp}</div>`;
          groups[grp].forEach(item => {
            html += `
              <a class="search-result-item" href="${item.href}" onclick="document.getElementById('searchOverlay').hidden=true">
                <div class="search-result-icon"><i class="bi ${item.icon}"></i></div>
                <div style="flex: 1; min-width: 0;">
                  <div class="search-result-title">${item.title.replace(/</g,'&lt;')}</div>
                  ${item.sub ? '<div class="search-result-sub">' + item.sub.replace(/</g,'&lt;') + '</div>' : ''}
                </div>
                <span class="search-result-type">${item.type}</span>
              </a>
            `;
          });
        }
      });

      results.innerHTML = html;
      selectedIndex = -1;
      updateSelection();
    }

    function updateTabsUI() {
      overlay.querySelectorAll('.search-tab').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-type') === selectedCategory);
      });
    }

    // Bind Category Tabs Clicks
    overlay.querySelectorAll('.search-tab').forEach(btn => {
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        selectedCategory = btn.getAttribute('data-type');
        updateTabsUI();
        renderResults();
        input.focus();
      });
    });
  })();

  window.getLocalDateISO = function(d) {
    const dt = d || new Date();
    const year = dt.getFullYear();
    const month = String(dt.getMonth() + 1).padStart(2, '0');
    const day = String(dt.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  };

  // Évite d'avoir une date de formulaire obsolète (ex: page ouverte avant minuit, soumise après minuit)
  (function autoUpdateDateInputs() {
    let lastToday = window.getLocalDateISO();
    setInterval(() => {
      const currentToday = window.getLocalDateISO();
      if (currentToday !== lastToday) {
        document.querySelectorAll('input[type="date"]').forEach(input => {
          if (input.value === lastToday) {
            input.value = currentToday;
            if (input.max === lastToday) input.max = currentToday;
          }
        });
        lastToday = currentToday;
      }
    }, 10000); // Check every 10 seconds
  })();

  // Digital Clock -- font+color animation (data loaded from external JSON)
  (function navClockRotator() {
    const clock = document.getElementById('navClock');
    if (!clock) return;
    clock.style.cursor = 'pointer';
    clock.style.transition = 'color 0.5s ease, font-family 0.3s ease, opacity 0.3s ease';
    clock.setAttribute('title', "Cliquer pour changer la couleur et la police de l'horloge");
    let currentFontIdx = -1;
    let currentColorIdx = -1;
    const nonce = document.querySelector('script[nonce]')?.getAttribute('nonce') || '';

    function tick() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      clock.textContent = `${hh}:${mm}:${ss}`;
    }

    function rotateClockColor(colors) {
      let idx;
      do { idx = Math.floor(Math.random() * colors.length); }
      while (idx === currentColorIdx && colors.length > 1);
      currentColorIdx = idx;
      clock.style.setProperty('color', colors[idx], 'important');
    }

    function rotateClockFont(fonts) {
      let idx;
      do { idx = Math.floor(Math.random() * fonts.length); }
      while (idx === currentFontIdx && fonts.length > 1);
      currentFontIdx = idx;
      const fontObj = fonts[idx];
      const fontId = `gfont-clock-${fontObj.name.replace(/\s+/g,'-').toLowerCase()}`;
      const applyFont = () => {
        clock.style.opacity = '0.08';
        setTimeout(() => {
          clock.style.setProperty('font-family', fontObj.stack, 'important');
          clock.style.opacity = '1';
        }, 300);
      };
      if (document.getElementById(fontId)) { applyFont(); return; }
      const link = document.createElement('link');
      link.id = fontId;
      link.rel = 'stylesheet';
      link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(fontObj.name)}&display=swap`;
      if (nonce) link.setAttribute('nonce', nonce);
      link.onload = applyFont;
      link.onerror = applyFont;
      document.head.appendChild(link);
      applyFont();
    }

    tick();
    setInterval(tick, 1000);

    fetch("{{ url_for('static', filename='js/data/clock-data.json') }}")
      .then(r => r.json())
      .then(data => {
        const fonts = data.fonts || [];
        const colors = data.colors || [];
        if (!fonts.length || !colors.length) return;
        clock.addEventListener('click', () => { rotateClockFont(fonts); rotateClockColor(colors); });
        rotateClockFont(fonts);
        rotateClockColor(colors);
        setInterval(() => rotateClockFont(fonts), 60000);
        setInterval(() => rotateClockColor(colors), 50000);
      })
      .catch(() => {});
  })();

  // 🔄 Expiration Glissante de Session (Sliding Session Keep-Alive)
  (function initSessionKeepAlive() {
    let lastActivity = Date.now();
    const TIMEOUT_MS = 15 * 60 * 1000; // 15 minutes d'inactivité
    const PING_INTERVAL_MS = 2 * 60 * 1000; // ping toutes les 2 minutes si actif
    let lastPing = Date.now();

    function resetActivity() {
      lastActivity = Date.now();
    }

    window.addEventListener('mousemove', resetActivity);
    window.addEventListener('keydown', resetActivity);
    window.addEventListener('click', resetActivity);
    window.addEventListener('scroll', resetActivity);

    setInterval(() => {
      const now = Date.now();
      
      // Si inactif depuis plus de 15 minutes, redirection automatique
      if (now - lastActivity > TIMEOUT_MS) {
        window.location.href = '/logout';
        return;
      }

      // Si l'utilisateur est actif, envoyer un ping pour prolonger la session
      if (now - lastPing > PING_INTERVAL_MS && now - lastActivity < PING_INTERVAL_MS) {
        lastPing = now;
        fetch('/api/v1/session/ping').catch(() => {});
      }
    }, 10000); // vérification toutes les 10 secondes
  })();
</script>
