<!-- ── Modal Scanner Code-Barres Camera ── -->
<div class="modal fade" id="barcodeScannerModal" tabindex="-1" aria-labelledby="barcodeScannerModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-md">
    <div class="modal-content" style="border-radius:18px; overflow:hidden; border:1px solid var(--line);">
      <div class="modal-header py-3 px-4" style="background:var(--bg-tertiary);">
        <h5 class="modal-title fs-6 fw-bold" id="barcodeScannerModalLabel">
          <i class="bi bi-qr-code-scan me-2 text-primary"></i>Scanner un code-barres
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer" onclick="stopBarcodeScanner()"></button>
      </div>
      <div class="modal-body p-3 text-center">
        <!-- Viewport pour le flux caméra -->
        <div id="barcodeReaderContainer" style="position:relative; width:100%; min-height:250px; background:#000; border-radius:12px; overflow:hidden;">
          <div id="barcodeReader" style="width:100%;"></div>
          <div id="barcodeScannerOverlay" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:75%; height:120px; border:2px dashed rgba(255,255,255,0.8); border-radius:12px; pointer-events:none; box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);">
            <div style="position:absolute; top:50%; left:5%; right:5%; height:2px; background:var(--system-red, #ff3b30); box-shadow:0 0 8px #ff3b30; animation: scanLine 2s infinite ease-in-out;"></div>
          </div>
        </div>
        <style nonce="{{ csp_nonce }}">
          @keyframes scanLine {
            0%, 100% { top: 10%; }
            50% { top: 90%; }
          }
        </style>

        <div id="barcodeScanFeedback" class="mt-2 text-muted small fw-medium">
          Orientez la caméra vers le code-barres EAN-13 / Code128
        </div>

        <!-- Saisie manuelle de secours -->
        <div class="input-group input-group-sm mt-3">
          <span class="input-group-text"><i class="bi bi-keyboard"></i></span>
          <input type="text" id="manualBarcodeInput" class="form-control" placeholder="Entrer le code manuellement..." inputmode="numeric">
          <button class="btn btn-primary" type="button" id="submitManualBarcodeBtn">Valider</button>
        </div>
      </div>
    </div>
  </div>
</div>
