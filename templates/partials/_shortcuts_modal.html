<!-- Raccourcis Clavier Modal -->
<div class="modal fade" id="shortcutsModal" tabindex="-1" aria-labelledby="shortcutsModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 12px;">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold" id="shortcutsModalLabel">
          <i class="bi bi-keyboard me-2 text-primary"></i>Raccourcis Clavier FABOuanes
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body">
        <div class="list-group list-group-flush">
          <div class="list-group-item d-flex justify-content-between align-items-center py-2 px-0 border-0">
            <span><i class="bi bi-cart-plus me-2 text-success"></i>Nouvelle Vente</span>
            <kbd class="bg-dark text-white px-2 py-1 rounded">Ctrl + N</kbd>
          </div>
          <div class="list-group-item d-flex justify-content-between align-items-center py-2 px-0 border-0">
            <span><i class="bi bi-search me-2 text-info"></i>Recherche Globale</span>
            <kbd class="bg-dark text-white px-2 py-1 rounded">Ctrl + Shift + F</kbd>
          </div>
          <div class="list-group-item d-flex justify-content-between align-items-center py-2 px-0 border-0">
            <span><i class="bi bi-chat-dots me-2 text-warning"></i>Assistant Sabrina</span>
            <kbd class="bg-dark text-white px-2 py-1 rounded">Ctrl + K</kbd>
          </div>
          <div class="list-group-item d-flex justify-content-between align-items-center py-2 px-0 border-0">
            <span><i class="bi bi-box-seam me-2 text-primary"></i>Espace Bons & Achats</span>
            <kbd class="bg-dark text-white px-2 py-1 rounded">Ctrl + B</kbd>
          </div>
          <div class="list-group-item d-flex justify-content-between align-items-center py-2 px-0 border-0">
            <span><i class="bi bi-question-circle me-2 text-muted"></i>Aide Raccourcis</span>
            <kbd class="bg-dark text-white px-2 py-1 rounded">F1</kbd>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
