name: Build Android APK (TWA Wrapper)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK Wrapper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Verify TWA Manifest & Assets
        run: |
          if [ -f "twa-manifest.json" ]; then
            echo "✅ twa-manifest.json trouvé !"
          else
            echo "⚠️ twa-manifest.json introuvable"
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fabouanes-twa-manifest
          path: twa-manifest.json
