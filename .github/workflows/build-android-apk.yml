name: Build Android APK (Native Wrapper)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android_wrapper/gradlew

      - name: Build Android APK with Gradle
        run: |
          cd android_wrapper
          ./gradlew assembleDebug --no-daemon

      - name: Upload FABOuanes APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FABouanes-Android-APK
          path: android_wrapper/app/build/outputs/apk/debug/app-debug.apk
