name: Build FABouanes Android APK & Offline Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Create Offline Bundle
      run: |
        python create_offline_bundle.py

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build Android APK with Gradle
      run: |
        cd android_app
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Prepare Release Artifacts
      run: |
        cp android_app/app/build/outputs/apk/debug/app-debug.apk FABouanes.apk

    - name: Upload FABouanes Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FABouanes-Android-Package
        path: |
          FABouanes.apk
          fabouanes_offline.zip
          setup_termux.sh

    - name: Create or Update GitHub Release with FABouanes.apk & Offline Zip
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v1.0.0
        name: FABouanes Android APK & Offline Bundle v1.0.0
        body: |
          Official FABouanes Standalone Android Application (APK) and Offline Installer.
          - `FABouanes.apk` : Standalone Android App
          - `fabouanes_offline.zip` : Full Offline Server Bundle for Termux
          - `setup_termux.sh` : Automated 1-Click Installer
        files: |
          FABouanes.apk
          fabouanes_offline.zip
          setup_termux.sh
