sonar.projectKey=ouanesfab-alt_FABouanes
sonar.organization=ouanesfab-alt
sonar.name=FABouanes

# Sources and Tests
sonar.sources=app
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# Coverage Report Mapping
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions for third-party, assets, installers, and test fixtures
sonar.exclusions=static/**,templates/**,installer/**,wheels/**,*.pem,*.key,*.exe,*.zip,sabrina_audit.jsonl,sabrina_failures.jsonl
sonar.coverage.exclusions=app/version.py,app/main.py,app/web/**,app/api/**,tests/**
